<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IELTS Mindset 3 – Study Hub · Design preview</title><style>
:root{color-scheme:dark;--bg:#080c20;--panel:#11192f;--panel2:#19223c;--text:#f1f5ff;--muted:#a8b4ce;--line:#2d3b59;--violet:#9671ff;--cyan:#67e5ff;--shadow:0 20px 60px #0003;--read:18px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% 0%,#48278644,transparent 40%),radial-gradient(ellipse at 5% 35%,#0b71852b,transparent 40%),var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}body.light{color-scheme:light;--bg:#f4f6fd;--panel:#fff;--panel2:#edf1fa;--text:#15223c;--muted:#50627f;--line:#cbd5e6;--violet:#6c3ce9;--cyan:#007d96}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:10px 16px;background:var(--panel2);white-space:normal}button:hover{border-color:var(--violet)}button:disabled{cursor:not-allowed;opacity:.58}button.primary{background:linear-gradient(110deg,#6c3ce9,#197db7);color:#fff;border:0;font-weight:650}button.ghost{background:transparent}button.active{background:#6c3ce930;border-color:var(--violet)}:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;min-height:44px;max-width:100%}textarea{width:100%;min-height:200px;resize:vertical}header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 26px;background:color-mix(in srgb,var(--bg) 91%,transparent);backdrop-filter:blur(15px);border-bottom:1px solid var(--line)}.brand{font-weight:750;letter-spacing:-.5px;display:flex;gap:12px;align-items:center}.brandIcon{border:1px solid #9f78ff;border-radius:12px;width:40px;height:40px;display:grid;place-items:center;background:linear-gradient(140deg,#6c3ce955,#32c9e033);color:var(--cyan)}.brand small{display:block;font-size:11px;font-weight:500;letter-spacing:1.5px;color:var(--muted)}.topActions,.langs,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.langs button{padding:8px 11px;font-size:13px}.searchTop{min-width:185px;text-align:left;color:var(--muted)}.shell{display:grid;grid-template-columns:236px minmax(0,1fr)}aside{padding:26px 16px;border-right:1px solid var(--line);position:sticky;top:84px;height:calc(100vh - 84px);overflow:auto}.navBtn{display:block;width:100%;text-align:left;margin-bottom:7px;background:none;border-color:transparent;font-size:14px}.navBtn span{display:inline-block;width:28px;color:var(--cyan)}main{padding:30px 38px 120px;max-width:1550px;width:100%;min-width:0}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:1.8px;font-weight:700;text-transform:uppercase}.notice{border:1px solid var(--line);border-left:3px solid var(--violet);border-radius:12px;padding:11px 16px;margin-bottom:26px;font-size:13px;color:var(--muted);background:var(--panel)}h1{font-size:clamp(30px,4.1vw,60px);line-height:1.12;letter-spacing:-1.9px;margin:14px 0 22px;font-weight:750}h2{font-size:24px;letter-spacing:-.7px;line-height:1.25;margin:0 0 12px}h3{font-size:18px;line-height:1.35;margin:0 0 12px}p{margin:10px 0 18px}.muted{color:var(--muted)}.hero{display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:42px;padding:15px 0 40px}.hero p{font-size:17px;max-width:55ch}.heroArt{min-height:300px;border:1px solid #6881cb66;border-radius:30px;background:linear-gradient(150deg,#5827a833,#078db633);position:relative;overflow:hidden;display:grid;place-items:center;box-shadow:var(--shadow)}.orbit{width:230px;height:230px;border:1px solid #9671ff88;border-radius:50%;box-shadow:0 0 50px #6956d83b,inset 0 0 50px #52cdec22;position:relative;display:grid;place-items:center;transform:rotate(-12deg)}.orbit:before,.orbit:after{content:"";position:absolute;width:280px;height:125px;border:1px solid #67e5ff88;border-radius:50%;transform:rotate(45deg)}.orbit:after{transform:rotate(-45deg)}.orbCenter{font-size:88px;font-weight:800;background:linear-gradient(#cbbaff,#67e5ff);background-clip:text;color:transparent;transform:rotate(12deg)}.orbLabel{position:absolute;background:var(--panel);border:1px solid var(--line);padding:10px 16px;border-radius:14px;font-size:13px;box-shadow:var(--shadow);max-width:160px}.orbLabel.one{top:22px;left:20px}.orbLabel.two{right:18px;bottom:24px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:34px}.stat,.card{background:linear-gradient(135deg,color-mix(in srgb,var(--panel) 95%,#7950ee 5%),var(--panel));border:1px solid var(--line);border-radius:20px;padding:22px;min-width:0}.stat strong{font-size:29px;display:block;letter-spacing:-1px}.stat small{color:var(--muted)}.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.unitCard{position:relative;overflow:hidden}.unitCard:before{content:"";height:3px;position:absolute;inset:0 0 auto;background:linear-gradient(90deg,var(--violet),var(--cyan))}.unitCard h3{margin:14px 0 10px;min-height:48px}.badge{display:inline-block;font-size:12px;color:var(--cyan);padding:4px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel2)}.pill{color:var(--muted);font-size:11px;padding:4px 8px;border-radius:20px;border:1px solid var(--line);display:inline-block;margin:3px}.meter{height:6px;background:var(--line);border-radius:10px;margin:18px 0 8px}.meter i{display:block;width:0;height:100%;background:var(--cyan)}.split{display:grid;grid-template-columns:1.2fr .8fr;gap:20px}.section{margin-top:30px}.filters{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.filters label{font-size:12px;color:var(--muted);min-width:155px}.filters select{display:block;margin-top:6px;width:100%}.list{display:grid;gap:12px}.listItem{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 20px;background:var(--panel);border:1px solid var(--line);border-radius:15px;min-width:0}.listItem p{margin:4px 0;font-size:13px;color:var(--muted)}.listItem h3{margin:0;font-size:16px}.listItem .meta{font-size:12px;color:var(--muted)}.placeholder{border:1px dashed var(--line);border-radius:14px;padding:22px;color:var(--muted);background:var(--panel2);min-height:130px;font-size:var(--read);max-width:68ch}.readBlock{font-size:var(--read);max-width:68ch;line-height:1.75}.subhead{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:0 0 15px}.criteria{display:grid;gap:10px;margin-top:18px}.criterion{border:1px solid var(--line);padding:12px;border-radius:12px}.criterion small{display:block;color:var(--muted)}.scoreRow{display:flex;gap:8px;margin-top:10px}.scoreRow button{min-width:44px}.player{position:fixed;left:250px;right:20px;bottom:16px;background:var(--panel);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);padding:13px 20px;display:flex;align-items:center;gap:14px;z-index:22;flex-wrap:wrap}.playerMeta{flex:1;min-width:130px}.playerMeta small{display:block;color:var(--muted);font-size:11px}.player input{flex:1;min-width:130px}.dialogBackdrop{position:fixed;inset:0;background:#030515bb;z-index:40;display:grid;place-items:start center;padding:100px 18px}.dialog{background:var(--panel);width:min(720px,100%);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow)}.dialog input{width:100%;margin:15px 0}.dialogResults{max-height:55vh;overflow:auto;display:grid;gap:8px}.dialogResults button{text-align:left;background:var(--panel2)}.dialogResults small{display:block;color:var(--muted)}.menuToggle{display:none}footer{font-size:12px;color:var(--muted);margin-top:40px}label.field{display:block;margin:14px 0}label.field select{display:block;width:100%;margin-top:6px}.timer{font-size:48px;font-variant-numeric:tabular-nums;color:var(--cyan);font-weight:750}.bars{display:grid;gap:16px}.bars .meter{margin-top:6px}.bilingual{display:grid;grid-template-columns:1fr 1fr;gap:16px}.bilingual p{margin:0}.sideUnits{margin-top:24px;border-top:1px solid var(--line);padding-top:18px}.sideUnits button{font-size:12px;width:100%;margin-top:7px;text-align:left}.checkboxList{padding:0;list-style:none}.checkboxList li{padding:9px 0;border-bottom:1px solid var(--line)}.ellipsis{overflow-wrap:anywhere}.wordMeta{font-size:13px;color:var(--muted);margin:9px 0}.closeMenu{display:none}.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);border:1px solid var(--cyan);background:var(--panel);padding:15px;border-radius:12px;z-index:60;max-width:90vw}
@media(min-width:1500px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}.unitCard h3{font-size:16px}.unitCard{padding:20px}}@media(max-width:1100px){.hero{gap:20px}.heroArt{min-height:270px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.bilingual{grid-template-columns:1fr}main{padding:26px 24px 155px}.topActions{gap:7px}.searchTop{min-width:0}.hero h1{font-size:43px}}
@media(max-width:760px){header{padding:10px 14px;align-items:flex-start;flex-wrap:wrap;gap:10px}.brand{font-size:14px;flex:1}.brandIcon{width:34px;height:34px}.topActions{width:100%;justify-content:space-between;flex-wrap:nowrap}.langs{flex-wrap:nowrap;gap:5px}.langs button{padding:8px;min-height:44px}.searchTop{font-size:12px;padding:8px;max-width:120px}.searchTop .key{display:none}.shell{display:block}aside{display:none}.menuToggle{display:block;min-width:44px;padding:7px}.shell.menuOpen aside{display:block;position:fixed;top:0;left:0;bottom:0;height:100vh;width:285px;background:var(--panel);z-index:35;box-shadow:0 0 0 100vw #0009}.closeMenu{display:block;margin-bottom:14px}main{padding:22px 16px 185px}.hero{grid-template-columns:1fr;padding:0 0 28px;gap:25px}.hero h1{font-size:38px;letter-spacing:-1px}.heroArt{min-height:250px}.orbit{width:175px;height:175px}.orbit:before,.orbit:after{width:220px}.orbCenter{font-size:70px}.hero p{font-size:15px}.notice{font-size:12px;margin-bottom:24px}.stats{gap:9px}.stat{padding:16px}.stat strong{font-size:25px}.grid{grid-template-columns:1fr}.unitCard h3{min-height:0}.card{padding:19px}.listItem{flex-wrap:wrap;gap:13px}.listItem button{width:100%}.player{left:10px;right:10px;bottom:8px;padding:11px;gap:7px}.player button{padding:8px}.player input{display:none}.playerMeta{width:100%;flex-basis:100%}.filters label{flex:1;min-width:140px}.dialogBackdrop{padding-top:30px}.dialog{padding:18px}.timer{font-size:43px}h2{font-size:23px}.unitCard button{width:100%}.topActions .themeTop{display:none}.sectionHead{align-items:flex-start}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><div id="app"></div><div id="searchLayer"></div><script>
const DATA=__EMBEDDED_DATA__;
const D=DATA.locales;let ui=localStorage.getItem('mindset3:preview:language')||(navigator.language.startsWith('vi')?'vi':'en');let solution=localStorage.getItem('mindset3:preview:solution')||'follow',theme=localStorage.getItem('mindset3:preview:theme')||'dark',page='home',unit='all',skill='all',selected=DATA.exercises[0].id,menu=false;const drafts={};
const nav=[['home','⌂'],['catalog','▦'],['audio','♫'],['examSkills','◇'],['writing','✎'],['speaking','◎'],['vocabulary','Aa'],['mock','◷'],['progress','↗'],['settings','⚙']];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function t(k,v={},mode=ui){if(!D.en[k]||!D.vi[k])throw new Error('Missing locale: '+k);const fill=s=>s.replace(/\{\{(\w+)\}\}/g,(_,n)=>esc(v[n]??''));if(mode==='both'&&D.vi[k]===D.en[k])return fill(D.en[k]);return mode==='both'?fill(D.vi[k])+' / '+fill(D.en[k]):fill(D[mode][k]);}
function title(u){return ui==='en'?u.title_en:ui==='both'?u.title_vi+' / '+u.title_en:u.title_vi}
function btn(key,act,cl='',disabled=false){return `<button class="${cl}" ${disabled?'disabled':''} data-action="${act}" ${disabled?`title="${t('common.planned')}"`:''}>${t(key)}</button>`}
function field(key,html){return `<label class="field">${t(key)}${html}</label>`}
function langIcon(x){if(x==='vi')return '<svg width="18" height="13" viewBox="0 0 36 26" aria-hidden="true"><rect width="36" height="26" rx="2" fill="#da251d"/><path fill="#ffdf00" d="M18 4l2.1 6.3h6.6l-5.3 3.9 2 6.3-5.4-3.9-5.4 3.9 2-6.3-5.3-3.9h6.6z"/></svg>';if(x==='en')return '<svg width="18" height="13" viewBox="0 0 36 26" aria-hidden="true"><rect width="36" height="26" rx="2" fill="#153e84"/><path stroke="#fff" stroke-width="5" d="M0 0l36 26M36 0L0 26"/><path stroke="#d62832" stroke-width="2" d="M0 0l36 26M36 0L0 26"/><path stroke="#fff" stroke-width="8" d="M18 0v26M0 13h36"/><path stroke="#d62832" stroke-width="4" d="M18 0v26M0 13h36"/></svg>';return ''}
function saveDrafts(){document.querySelectorAll('.draft').forEach(x=>drafts[x.id]=x.value)}
function render(){saveDrafts();document.documentElement.lang=ui==='en'?'en':'vi';document.body.classList.toggle('light',theme==='light');document.getElementById('app').innerHTML=`<header><button class="menuToggle" data-action="menu" aria-label="${t('nav.menu')}">☰</button><div class="brand"><div class="brandIcon">M3</div><div>IELTS Mindset 3<small>STUDY HUB</small></div></div><div class="topActions"><button class="searchTop" data-action="search">⌕ ${t('search.label')} <span class="key">⌘ K</span></button><div class="langs" aria-label="${t('language.interface')}">${['vi','en','both'].map(x=>`<button class="${x===ui?'active':''}" data-language="${x}" aria-pressed="${x===ui}" title="${t('language.shortcut')}">${langIcon(x)} ${t('language.'+x).replace(/🇻🇳|🇬🇧/g,'')}</button>`).join('')}</div><button class="themeTop ghost" data-action="theme" aria-label="${t('settings.theme')}">${theme==='dark'?'☀':'☾'}</button></div></header><div class="shell ${menu?'menuOpen':''}"><aside><button class="closeMenu" data-action="menu">${t('nav.close')}</button>${nav.map(([n,i])=>`<button class="navBtn ${page===n?'active':''}" data-page="${n}"><span aria-hidden="true">${i}</span>${t('nav.'+n)}</button>`).join('')}<div class="sideUnits"><div class="subhead">${t('nav.contents')}</div>${DATA.units.map(u=>`<details><summary>${t('unit.label',{number:u.unit})} · ${esc(title(u))}</summary>${['reading','writing','listening','speaking'].map(sk=>`<details style="padding-left:9px"><summary>${t('skill.'+sk)}</summary>${DATA.exercises.filter(e=>e.unit===u.unit&&e.skills[0]===sk).map(e=>`<button class="ghost" data-exercise="${e.id}">${t('exercise.label',{number:e.exerciseNo})}</button>`).join('')}</details>`).join('')}</details>`).join('')}</div></aside><main><div class="notice"><strong>${t('app.prototype')}</strong><br>${t('app.prototypeNotice')}</div>${content()}<footer>${t('app.course')} · ${t('hero.source')}</footer></main></div>${page==='audio'||page==='exercise'?player():''}`;document.querySelectorAll('.draft').forEach(x=>{if(drafts[x.id]!=null)x.value=drafts[x.id]});attach();}
function content(){if(page==='home')return home();if(page==='catalog')return catalog();if(page==='exercise')return exercise();if(page==='audio')return audio();if(page==='settings')return settings();if(page==='writing')return writing();if(page==='speaking')return speaking();if(page==='mock')return mock();if(page==='progress')return progress();if(page==='examSkills')return tips();return vocab();}
function home(){return `<section class="hero"><div><div class="eyebrow">${t('hero.eyebrow')}</div><h1>${t('hero.title')}</h1><p class="muted">${t('hero.description')}</p><div class="row">${btn('hero.start','start','primary')}${btn('hero.audio','audio','ghost')}</div></div><div class="heroArt" aria-hidden="true"><div class="orbit"><div class="orbCenter">3</div></div><div class="orbLabel one">${t('skill.reading')}<br>${t('skill.writing')}</div><div class="orbLabel two">${t('skill.listening')}<br>${t('skill.speaking')}</div></div></section><div class="stats">${[[289,'stats.exercises'],[52,'stats.tracks'],[5,'stats.units'],['—','stats.vocabulary']].map(([n,k])=>`<div class="stat"><strong>${n}</strong><small>${t(k)}${n==='—'?'<br>'+t('stats.notImported'):''}</small></div>`).join('')}</div><div class="sectionHead"><div><h2>${t('home.units')}</h2><div class="muted">${t('home.unitSubtitle')}</div></div></div><div class="grid">${DATA.units.map(u=>`<article class="card unitCard"><div class="eyebrow">${t('unit.label',{number:u.unit})}</div><h3>${esc(title(u))}</h3><div>${['reading','writing','listening','speaking'].map(s=>`<span class="pill">${t('skill.'+s)}</span>`).join('')}</div><div class="meter"><i></i></div><small class="muted">${t('unit.completion',{percent:0})} · ${t('unit.exercises',{count:u.exerciseCount})}</small><p><span class="badge">${t('unit.pending')}</span></p><button class="ghost" data-unit="${u.unit}">${t('unit.open')}</button></article>`).join('')}</div><div class="section split"><div class="card"><h3>${t('home.continue')}</h3><p class="muted">${t('home.noActivity')}</p>${btn('hero.start','start','primary')}</div><div class="card"><h3>${t('home.courseAssessment')}</h3><ul class="checkboxList"><li>${t('home.regular')}</li><li>${t('home.progressTest')}</li><li>${t('home.final')}</li></ul></div></div>`;}
function filters(){return `<div class="filters"><label>${t('filter.unit')}<select id="unitFilter"><option value="all">${t('filter.allUnits')}</option>${DATA.units.map(u=>`<option value="${u.unit}" ${unit===String(u.unit)?'selected':''}>${t('unit.label',{number:u.unit})} · ${esc(title(u))}</option>`).join('')}<option value="additional" ${unit==='additional'?'selected':''}>${t('audio.additional')}</option></select></label>${page==='catalog'?`<label>${t('filter.skill')}<select id="skillFilter"><option value="all">${t('filter.allSkills')}</option>${['reading','writing','listening','speaking'].map(s=>`<option value="${s}" ${skill===s?'selected':''}>${t('skill.'+s)}</option>`).join('')}</select></label><label>${t('filter.type')}<select disabled><option>${t('filter.unknown')}</option></select></label><label>${t('filter.difficulty')}<select disabled><option>${t('filter.unknown')}</option></select></label><label>${t('filter.status')}<select disabled><option>${t('status.notStarted')}</option></select></label>`:''}</div>`;}
function catalog(){let es=DATA.exercises.filter(e=>(unit==='all'||String(e.unit)===unit)&&(skill==='all'||e.skills.includes(skill)));return `<h2>${t('catalog.title')}</h2><p class="muted">${t('catalog.description')}</p>${filters()}<p class="muted">${t('search.results',{count:es.length})}</p><div class="list">${es.map(e=>`<article class="listItem"><div><h3>${esc(e.sourceLabel)}</h3><div class="meta">${esc(e.id)} · ${t('status.pending')}</div></div><button data-exercise="${e.id}">${t('catalog.open')}</button></article>`).join('')||`<div class="card">${t('search.none')}</div>`}</div>`;}
function exercise(){const e=DATA.exercises.find(x=>x.id===selected),m=solution==='follow'?ui:solution;return `<p class="muted">${t('unit.label',{number:e.unit})} › ${t('skill.'+e.skills[0])} › ${t('exercise.label',{number:e.exerciseNo})}</p><div class="sectionHead"><h2>${esc(e.sourceLabel)}</h2><div class="row">${btn('exercise.bookmark','planned')}${btn('nav.previous','previous')}${btn('nav.next','next')}</div></div><div class="split"><div class="card"><h3>${t('exercise.instructions')}</h3><div class="placeholder" lang="en">${t('common.sourcePending',{},'en')}</div><h3 class="section">${t('exercise.passage')}</h3><div class="placeholder" lang="en">${t('preview.source',{},'en')}<p>${t('common.sourcePending',{},'en')}</p></div></div><div class="card"><h3>${t('exercise.questions')}</h3><p class="muted">${t('preview.notAQuestion')}</p>${field('preview.answer',`<input class="draft" id="answer-demo" placeholder="${t('exercise.answerPlaceholder')}" style="width:100%">`)}<div class="row">${btn('exercise.check','planned','primary',true)}${btn('exercise.showAnswers','planned','',true)}</div>${field('exercise.notes',`<textarea class="draft" id="note-demo" placeholder="${t('exercise.notesPlaceholder')}"></textarea>`)}<p class="muted">${t('status.pending')}</p></div></div><div class="card section"><h3>${t('preview.explanation',{},m)}</h3><div class="${m==='both'?'bilingual':''}">${m==='both'?`<div lang="en">${solutionList('en')}</div><div lang="vi">${solutionList('vi')}</div>`:solutionList(m)}</div></div>`;}
function solutionList(m){return ['answer','why','alternatives','evidence','keywords','tips','language'].map(k=>`<p><strong>${t('solution.'+k,{},m)}</strong><br><span class="muted">${t('status.needsChecking',{},m)}</span></p>`).join('');}
function audio(){let tracks=DATA.audio.filter(x=>unit==='all'||unit==='additional'&&x.unit===null||String(x.unit)===unit);return `<h2>${t('nav.audio')}</h2><p class="muted">${t('preview.audioScope')}</p>${filters()}<input id="trackSearch" aria-label="${t('search.label')}" placeholder="${t('search.placeholder')}" style="width:100%;margin-bottom:18px"><div class="list" id="trackList">${trackRows(tracks)}</div><div class="card section"><h3>${t('audio.missing')}</h3><p class="muted">02–08 · 10–13 · 22–24 · 29–30</p><p>${t('audio.identityPending')}</p></div>`;}
function trackRows(tracks){return tracks.map(x=>{let d=Math.round(x.durationSec);return `<article class="listItem"><div><h3>${t('audio.track',{number:x.track})} <span class="badge">${x.unit?t('unit.label',{number:x.unit}):t('audio.additional')}</span></h3><p>${esc(x.originalName)} · ${Math.floor(d/60)}:${String(d%60).padStart(2,'0')} · ${new Intl.NumberFormat(ui==='en'?'en-GB':'vi-VN',{maximumFractionDigits:2}).format(x.sizeBytes/1e6)} MB</p><div class="meta ellipsis">${t('audio.usedIn')}: ${x.exerciseIds.length?x.exerciseIds.map(esc).join(', '):t('audio.outsideScope')}</div></div>${btn('audio.play','planned','',true)}</article>`}).join('');}
function player(){return `<section class="player" aria-label="${t('nav.audio')}"><div class="playerMeta"><strong>${t('nav.audio')}</strong><small>${t('audio.notInApp')}</small></div><button disabled aria-label="${t('audio.back')}">−5s</button><button disabled aria-label="${t('audio.play')}">▶</button><button disabled aria-label="${t('audio.forward')}">+5s</button><select disabled aria-label="${t('audio.speed')}"><option>0.75×</option><option selected>1×</option><option>1.25×</option></select><button disabled aria-label="${t('audio.setA')}">A</button><button disabled aria-label="${t('audio.setB')}">B</button></section>`;}
function settings(){return `<h2>${t('nav.settings')}</h2><div class="split section"><div class="card">${field('language.interface',`<select id="uiSetting">${['vi','en','both'].map(x=>`<option value="${x}" ${ui===x?'selected':''}>${t('language.'+x)}</option>`).join('')}</select>`)}${field('language.solutions',`<select id="solutionSetting">${['follow','vi','en','both'].map(x=>`<option value="${x}" ${solution===x?'selected':''}>${t('language.'+x)}</option>`).join('')}</select>`)}${field('settings.theme',`<select id="themeSetting"><option value="dark" ${theme==='dark'?'selected':''}>${t('settings.dark')}</option><option value="light" ${theme==='light'?'selected':''}>${t('settings.light')}</option></select>`)}${field('settings.fontSize',`<input type="range" min="16" max="24" value="${parseInt(document.documentElement.style.getPropertyValue('--read'))||18}" id="fontSetting">`)}</div><div class="card"><h3>${t('settings.shortcuts')}</h3><p>Alt + L · ${t('language.shortcut')}</p><p>Ctrl / ⌘ + K · ${t('search.label')}</p><p>Esc · ${t('common.close')}</p><p class="muted">${t('preview.navigation')}</p></div></div>`;}
function writing(){return `<h2>${t('nav.writing')}</h2><p class="muted">${t('preview.writingConflict')}</p><div class="row section"><button data-task="1">${t('writing.task1')}</button><button class="active" data-task="2">${t('writing.task2')}</button></div><div class="split section"><div class="card"><h3>${t('writing.prompt')}</h3><div class="placeholder" lang="en">${t('common.sourcePending',{},'en')}</div><h3 class="section">${t('writing.model')}</h3><div class="row"><span class="badge">${t('writing.bookSource')}</span><span class="badge">${t('writing.supplement')}</span></div><p class="muted">${t('status.needsChecking')}</p><div class="criteria">${['taskResponse','coherence','lexical','grammar'].map(k=>`<div class="criterion">${t('criteria.'+k)}<small>${t('status.needsChecking')}</small></div>`).join('')}</div></div><div class="card"><div class="row"><span class="badge">${t('preview.timer')}</span><div class="timer" id="writingTimer">40:00</div></div>${btn('writing.startTimer','planned','',true)}${field('writing.draft',`<textarea class="draft" id="writing-draft" placeholder="${t('writing.draftPlaceholder')}"></textarea>`)}<div class="wordMeta" id="wordCount">${t('writing.wordCount',{count:0})}</div><p class="muted">${t('writing.noAutomaticBand')}</p></div></div>`;}
function speaking(){return `<h2>${t('nav.speaking')}</h2><p class="muted">${t('preview.cardsPending')}</p><div class="split section"><div class="card"><h3>${t('writing.prompt')}</h3><div class="placeholder" lang="en">${t('common.sourcePending',{},'en')}</div><div class="row section"><span class="badge">${t('speaking.prepare')}</span><span class="badge">${t('speaking.speak')}</span></div><div class="timer">01:00 → 02:00</div><div class="row">${btn('speaking.record','planned','primary',true)}${btn('speaking.playback','planned','',true)}</div><p class="muted">${t('speaking.permission')}</p></div><div class="card"><h3>${t('speaking.rubric')}</h3><p class="muted">${t('speaking.rubricNotice')}</p>${['grammar','pronunciation','vocabulary','background','fluency'].map(k=>`<div class="criterion"><strong>${t('rubric.'+k)}</strong><div class="scoreRow">${[1,2,3,4].map(n=>`<button data-score="${k}-${n}" aria-label="${t('rubric.'+k)}: ${t('rubric.level'+n)}">${n}</button>`).join('')}</div></div>`).join('')}</div></div>`;}
function mock(){return `<h2>${t('nav.mock')}</h2><p class="muted">${t('mock.sourceNotice')}</p><div class="split section">${[['final',90],['progress',null]].map(([n,m])=>`<div class="card"><h3>${t('mock.'+n)}</h3><p class="badge">${m?t('mock.duration',{minutes:m}):t('status.pending')}</p><p>${t('mock.englishInstructions')}</p><div class="placeholder" lang="en">${t('common.sourcePending',{},'en')}</div><div class="section">${btn('mock.start','planned','primary',true)}</div></div>`).join('')}</div>`;}
function progress(){return `<h2>${t('nav.progress')}</h2><p class="muted">${t('preview.progress')}</p><div class="split section"><div class="card"><h3>${t('home.units')}</h3><div class="bars">${['reading','listening','writing','speaking','grammar','vocabulary'].map(s=>`<div>${t('skill.'+s)} · 0%<div class="meter"><i></i></div></div>`).join('')}</div></div><div class="card"><h3>${t('home.continue')}</h3><p class="muted">${t('progress.empty')}</p><div class="row">${btn('progress.export','planned','',true)}${btn('progress.import','planned','',true)}</div><p class="muted">${t('progress.local')}</p><p class="muted">${t('progress.recordingExport')}</p></div></div>`;}
function tips(){return `<h2>${t('examSkills.title')}</h2><p class="muted">${t('examSkills.description')}</p><div class="grid section">${['matchingHeadings','tfng','ynng','completion','multipleChoice','map'].map(k=>`<div class="card"><h3>${t('type.'+k)}</h3><p class="muted">${t('status.pending')}</p>${btn('common.preview','planned','',true)}</div>`).join('')}</div>`;}
function vocab(){return `<h2>${t('nav.vocabulary')}</h2><div class="split section"><div class="card">${field('vocabulary.direction',`<select id="vocabDirection">${['enVi','viEn','definitionWord'].map(k=>`<option>${t('vocabulary.'+k)}</option>`).join('')}</select>`)}<div class="placeholder">${t('stats.notImported')}</div><div class="row section">${btn('vocabulary.flip','planned','',true)}${btn('vocabulary.pronounce','planned','',true)}</div></div><div class="card"><h3>${t('vocabulary.quiz')}</h3><p class="muted">${t('common.sourcePending')}</p>${btn('common.open','planned','primary',true)}</div></div>`;}
function setLang(x){ui=x;localStorage.setItem('mindset3:preview:language',ui);render()}
function attach(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;menu=false;render();scrollTo(0,0)});document.querySelectorAll('[data-language]').forEach(b=>b.onclick=()=>setLang(b.dataset.language));document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{unit=b.dataset.unit;page='catalog';menu=false;render();scrollTo(0,0)});document.querySelectorAll('[data-exercise]').forEach(b=>b.onclick=()=>{selected=b.dataset.exercise;page='exercise';menu=false;render();scrollTo(0,0)});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));for(const id of ['unitFilter','skillFilter','uiSetting','solutionSetting','themeSetting','fontSetting']){let x=document.getElementById(id);if(x)x.onchange=()=>{if(id==='unitFilter')unit=x.value;if(id==='skillFilter')skill=x.value;if(id==='uiSetting')ui=x.value;if(id==='solutionSetting'){solution=x.value;localStorage.setItem('mindset3:preview:solution',solution)}if(id==='themeSetting')theme=x.value;if(id==='fontSetting')document.documentElement.style.setProperty('--read',x.value+'px');localStorage.setItem('mindset3:preview:language',ui);localStorage.setItem('mindset3:preview:theme',theme);render()}}const ts=document.getElementById('trackSearch');if(ts)ts.oninput=()=>{let q=normalize(ts.value);document.getElementById('trackList').innerHTML=trackRows(DATA.audio.filter(x=>(unit==='all'||unit==='additional'&&x.unit===null||String(x.unit)===unit)&&normalize(x.track+' '+x.originalName+' '+x.exerciseIds.join(' ')).includes(q)))};const wd=document.getElementById('writing-draft');if(wd){const update=()=>{const count=wd.value.trim()?wd.value.trim().split(/\s+/u).length:0;document.getElementById('wordCount').textContent=t('writing.wordCount',{count});drafts[wd.id]=wd.value};wd.oninput=update;update()}document.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>{let group=b.parentElement;group.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-task]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('writingTimer').textContent=b.dataset.task==='1'?'20:00':'40:00'})}
function action(a){if(a==='menu'){menu=!menu;render()}else if(a==='theme'){theme=theme==='dark'?'light':'dark';localStorage.setItem('mindset3:preview:theme',theme);render()}else if(a==='search')openSearch();else if(a==='start'){unit='1';page='catalog';render();scrollTo(0,0)}else if(a==='audio'){unit='all';page='audio';render();scrollTo(0,0)}else if(a==='next'||a==='previous'){const i=DATA.exercises.findIndex(e=>e.id===selected);selected=DATA.exercises[Math.max(0,Math.min(DATA.exercises.length-1,i+(a==='next'?1:-1)))].id;render();scrollTo(0,0)}else{const x=document.createElement('div');x.className='toast';x.textContent=t('common.planned');document.body.append(x);setTimeout(()=>x.remove(),2200)}}
const normalize=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[đĐ]/g,'d').toLowerCase().trim();let searchReturnFocus=null;
function openSearch(){searchReturnFocus=document.activeElement;document.getElementById('searchLayer').innerHTML=`<div class="dialogBackdrop"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="searchTitle"><div class="sectionHead"><h3 id="searchTitle">${t('search.label')}</h3><button id="searchClose">${t('common.close')}</button></div><p class="muted">${t('search.scope')}</p><input id="globalSearch" aria-label="${t('search.label')}" placeholder="${t('search.placeholder')}"><div class="dialogResults" id="results"></div></section></div>`;const close=()=>closeSearch();document.getElementById('searchClose').onclick=close;const inp=document.getElementById('globalSearch');inp.oninput=()=>{let q=normalize(inp.value),results=[];if(q)for(const e of DATA.exercises){let u=DATA.units[e.unit-1];if(normalize(e.sourceLabel+' '+e.id+' '+u.title_en+' '+u.title_vi).includes(q))results.push(e)}document.getElementById('results').innerHTML=results.slice(0,20).map(e=>`<button data-search-result="${e.id}">${esc(e.sourceLabel)}<small>${t('status.pending')}</small></button>`).join('')||(q?`<p>${t('search.none')}</p>`:'');document.querySelectorAll('[data-search-result]').forEach(b=>b.onclick=()=>{selected=b.dataset.searchResult;page='exercise';close();render();scrollTo(0,0)})};inp.focus();}
function closeSearch(){document.getElementById('searchLayer').innerHTML='';if(searchReturnFocus?.isConnected)searchReturnFocus.focus()}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.altKey&&e.key.toLowerCase()==='l'){e.preventDefault();closeSearch();setLang(['vi','en','both'][(['vi','en','both'].indexOf(ui)+1)%3])}if(e.key==='Escape'){closeSearch();if(menu){menu=false;render()}}if(e.key==='Tab'&&document.getElementById('globalSearch')){const f=[...document.querySelectorAll('.dialog button,.dialog input')];let i=f.indexOf(document.activeElement);if(e.shiftKey&&i===0){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}});render();
</script></body></html>
